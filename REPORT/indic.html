var args = [
  { title: 'Indicator Color', x:0, y:1000, w:540, h:320, fnMenu:xfMenu, minW: 150, conBor: 2, conPad: 1, cliBor: 0, noStatus: true,  noResize: true,  noMinimize: false, noMaximize: false, noClose: false }
 
];
xAddEventListener(window, 'load',
  function() {
    for (var i = 0; i < args.length; ++i) {
      args[i].clientId = 'xf' + (i + 1);
      new xFenster(args[i]);
    }
    xGetElementById('clk1').onclick=function(){xFenster.paintAll();};
    xGetElementById('clk2').onclick=function(){xFenster.showAll();};
    xGetElementById('clk3').onclick=function(){xFenster.hideAll();};
    xGetElementById('clk4').onclick=function(){xFenster.minimizeAll();};
    xGetElementById('clk5').onclick=function(){xFenster.maximizeAll();};
    xGetElementById('clk6').onclick=function(){xFenster.restoreAll();};
  }, false
);
function xfMenu(xf)
{
  if (xf.mnu.innerHTML.length == 0) {
    xf.mnu.innerHTML =
        '<a class="xfMnuCmd showAll" href="#">Show All</a>' +
        '<a class="xfMnuCmd hideAll" href="#">Hide All</a>' +
        '<a class="xfMnuCmd paintAll" href="#">Paint All</a>' +
        '<a class="xfMnuCmd restoreAll" href="#">Restore All</a>' +
        '<a class="xfMnuCmd minimizeAll" href="#">Minimize All</a>' +
        '<a class="xfMnuCmd maximizeAll" href="#">Maximize All</a>';
    xGetElementsByClassName('xfMnuCmd', xf.mnu, 'a', function(a){a.onclick=xfMnuClk;});
  }
  return true;
}
function xfMnuClk(ne)
{
  var a = this.className.split(' ');
  if (xFenster.focused) xFenster.focused.mnuHide();
  if (a && a.length > 0) {
    xFenster[a[a.length - 1]]();
  }
  return false; // cancel the click
}
</script>
